<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ilhas Perdidas — A Aventura dos 4</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============ TELA 1: TÍTULO ============ -->
  <section id="tela-titulo" class="tela ativa">
    <div class="titulo-box">
      <div class="emblema">🏝️</div>
      <h1 class="jogo-titulo">ILHAS PERDIDAS</h1>
      <p class="jogo-subtitulo">A Aventura dos 4</p>
      <button class="btn btn-grande" onclick="irParaHistoria()">▶ COMEÇAR</button>
    </div>
    <div class="ondas"></div>
  </section>

  <!-- ============ TELA 2: HISTÓRIA ============ -->
  <section id="tela-historia" class="tela">
    <div class="historia-box">
      <p id="historia-texto" class="historia-texto"></p>
      <button id="btn-historia" class="btn" onclick="proximaHistoria()">Continuar ▶</button>
    </div>
  </section>

  <!-- ============ TELA 3: CRIAR PERSONAGEM ============ -->
  <section id="tela-criar" class="tela">
    <div class="criar-box">
      <h2>Crie seu Herói</h2>

      <label class="label">Nome do herói:</label>
      <input id="input-nome" class="input-nome" type="text" placeholder="Digite um nome..." maxlength="14" />

      <label class="label">Escolha a profissão:</label>
      <div class="profissoes">
        <button class="prof" data-prof="policial" onclick="escolherProfissao('policial', this)">
          <span class="prof-icone">👮</span>
          <span class="prof-nome">Policial</span>
        </button>
        <button class="prof" data-prof="bombeiro" onclick="escolherProfissao('bombeiro', this)">
          <span class="prof-icone">🚒</span>
          <span class="prof-nome">Bombeiro</span>
        </button>
        <button class="prof" data-prof="medico" onclick="escolherProfissao('medico', this)">
          <span class="prof-icone">🧑‍⚕️</span>
          <span class="prof-nome">Médico</span>
        </button>
        <button class="prof" data-prof="cozinheiro" onclick="escolherProfissao('cozinheiro', this)">
          <span class="prof-icone">🧑‍🍳</span>
          <span class="prof-nome">Cozinheiro</span>
        </button>
      </div>

      <p id="prof-descricao" class="prof-descricao">Toque numa profissão para ver o que ela faz.</p>

      <button id="btn-criar" class="btn btn-grande" onclick="comecarAventura()" disabled>🚀 COMEÇAR AVENTURA</button>
    </div>
  </section>

  <!-- ============ TELA 4: ILHA INICIAL ============ -->
  <section id="tela-ilha" class="tela">
    <div class="ilha-topo">
      <span id="ilha-info-heroi" class="ilha-info"></span>
    </div>

    <div class="ilha-cena">
      <div class="ilha-chao">
        <div class="palmeira">🌴</div>
        <div id="heroi-sprite" class="heroi-sprite">👮</div>
        <div class="ron-ilha" title="Ron, o mascote!">🐉</div>
        <div class="fogueira">🔥</div>
      </div>
      <div class="ilha-mar"></div>
    </div>

    <div class="ilha-fala">
      <p id="ilha-dialogo"></p>
      <button id="btn-olhar" class="btn" onclick="explorarIlha()">Olhar em volta 👀</button>
      <button id="btn-viajar" class="btn" onclick="viajarPrimeiraIlha()" style="display:none;">🚢 Viajar para a 1ª ilha</button>
    </div>
  </section>

  <!-- ============ TELA 5: BATALHA ============ -->
  <section id="tela-batalha" class="tela">
    <div class="batalha-topo">
      <span id="cap-titulo" class="cap-titulo">Capítulo 1</span>
    </div>

    <div class="batalha-arena">
      <!-- Inimigo -->
      <div class="lado-inimigo">
        <div class="combatente">
          <span id="batalha-inimigo-nome" class="comb-nome">Inimigo</span>
          <div class="barra-fundo"><div id="barra-inimigo" class="barra barra-inimigo"></div></div>
          <span id="vida-inimigo-txt" class="vida-txt">0/0</span>
        </div>
        <div id="batalha-inimigo-sprite" class="sprite sprite-inimigo">👹</div>
      </div>

      <div class="versus">⚔️</div>

      <!-- Herói -->
      <div class="lado-heroi">
        <div class="heroi-com-ron">
          <div id="batalha-heroi-sprite" class="sprite sprite-heroi">🧑‍🍳</div>
          <div id="ron-batalha" class="ron-batalha" title="Ron">🐉</div>
        </div>
        <div class="combatente">
          <span id="batalha-heroi-nome" class="comb-nome">Herói</span>
          <div class="barra-fundo"><div id="barra-heroi" class="barra barra-heroi"></div></div>
          <span id="vida-heroi-txt" class="vida-txt">100/100</span>
        </div>
      </div>
    </div>

    <div class="batalha-log-box">
      <p id="batalha-log">...</p>
    </div>

    <div class="batalha-acoes">
      <button class="btn btn-acao" onclick="acaoAtacar()">⚔️ Atacar</button>
      <button class="btn btn-acao btn-especial" onclick="acaoEspecial()">✨ Especial</button>
      <button class="btn btn-acao btn-defender" onclick="acaoDefender()">🛡️ Defender</button>
    </div>
  </section>

  <!-- ============ TELA 6: FIM / VITÓRIA ============ -->
  <section id="tela-fim" class="tela">
    <div class="fim-box">
      <h2 id="fim-titulo">Fim</h2>
      <p id="fim-texto"></p>
      <button id="btn-fim" class="btn btn-grande">Continuar</button>
    </div>
  </section>

  <!-- Aviso para virar o celular na horizontal -->
  <div id="aviso-girar">
    <div class="aviso-girar-box">
      <div class="aviso-girar-icone">📱↔️</div>
      <p>Vire o celular na <b>horizontal</b> para jogar melhor!</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
